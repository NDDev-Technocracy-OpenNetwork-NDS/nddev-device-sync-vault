[package]
name = "nddev-device-sync-vault"
version = "0.0.1-alpha.12"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault"

[features]
browser-bindings = ["dep:tsify"]
default = []
development-http = ["nddev-device-sync-accounts/development-http"]

[dependencies]
nddev-device-sync-application = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "ad614122d5916accbe1cca198768968b8c5bad0e" }
base64 = "0.23.1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "55291f01682fdba5802653225708cac815f04edb" }
time = { version = "0.3", features = ["wasm-bindgen"] }
uuid = { version = "1.27", features = ["v4"] }
nddev-device-sync-domain = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "ad614122d5916accbe1cca198768968b8c5bad0e" }
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "0c6bb254b72cbbcd85328f03cbeb62451b0c19ca" }

tokio = { version = "1.53", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.11.1"
base16ct = { version = "1.0", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
time = {version="0.3",features=["parsing"]}
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify = { version = "=0.5.8", default-features = false, features = ["js"], optional = true }
rusqlite = { version="=0.41.1",default-features=false,features=["ffi-sqlite-wasm-rs","fallible_uint"] }
# Keep the native/browser wrappers and their VFS callbacks in one API family.
sqlite-wasm-rs = "=0.6.2"
sqlite-wasm-vfs = "=0.3.0"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
uuid = { version="1.27",features=["js"] }
ring = { version="0.17",features=["wasm32_unknown_unknown_js"] }
