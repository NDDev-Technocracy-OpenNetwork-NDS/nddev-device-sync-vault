# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@65901e0f87cb8bc931c2f92ff60c319859aec60b # v0.6.164
    permissions:
      contents: read
    with:
      setup: true
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
      rust-targets: wasm32-unknown-unknown
      bun-version: 1.4.4
      tool-assets: .github/ci-tools.json

  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@65901e0f87cb8bc931c2f92ff60c319859aec60b # v0.6.164
    permissions:
      contents: read
    with:
      hosted-runner: ${{ matrix.os }}
      prepare: native-setup
      recipe: native-check
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
