name: promotion

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only a same-repository dev push; no run code or artifacts are consumed
    workflows: [ci]
    types: [completed]
    branches: [dev]
  workflow_dispatch: {}

permissions: {}

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@276ebc72582644040950ff13629469e16370d432 # v0.6.169
    secrets: inherit # zizmor: ignore[secrets-inherit] the dev-only promotion environment holds the key
    permissions:
      actions: write
      contents: read
